_format_version: "3.0"
services:
- connect_timeout: 60000
  enabled: true
  host: 172.17.0.1
  name: backend-service
  port: 5000
  protocol: http
  read_timeout: 60000
  retries: 5
  routes:
  - https_redirect_status_code: 426
    id: 164ab53c-b296-4a1c-8f29-f439abf759ac
    path_handling: v0
    paths:
    - /read-me-out
    plugins:
    - config:
        add:
          body: []
          headers:
          - X-Forwarded-Prefix:/read-me-out
          querystring: []
        append:
          body: []
          headers: []
          querystring: []
        http_method: null
        remove:
          body: []
          headers: []
          querystring: []
        rename:
          body: []
          headers: []
          querystring: []
        replace:
          body: []
          headers: []
          querystring: []
          uri: null
      enabled: true
      name: request-transformer
      protocols:
      - grpc
      - grpcs
      - http
      - https
    preserve_host: true
    protocols:
    - http
    - https
    regex_priority: 0
    request_buffering: true
    response_buffering: true
    strip_path: true
  write_timeout: 60000
