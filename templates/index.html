<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Read Me Out - Text to Speech</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="overlay"></div>

    <!-- Hamburger Menu Button -->
    <div class="hamburger-menu">
        <div class="hamburger-icon">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h3>Read Me Out</h3>
            <div class="close-sidebar">
                <i class="fas fa-times"></i>
            </div>
        </div>
        <div class="sidebar-content">
            <ul class="sidebar-menu">
                <li><a href="/"><i class="fas fa-home"></i> Home</a></li>
                <li class="auth-required"><a href="/dashboard"><i class="fas fa-book"></i> My Articles</a></li>
            </ul>
        </div>
    </div>

    <div class="container">
        <div class="header-container">
            <h1>Read Me Out</h1>
            <div class="user-container">
                <div class="user-info">
                    <div class="user-pic"></div>
                    <div class="user-name"></div>
                    <a href="#" id="logout-link" class="logout-btn">Logout</a>
                </div>
                <div class="login-container">
                    <a href="/login" class="login-btn">
                        <i class="fab fa-google"></i> Sign in with Google
                    </a>
                </div>
            </div>
        </div>

        <div class="welcome-message">
            <h2>歡迎使用 Read Me Out</h2>
            <p>這是一個文字轉語音的應用程式，可以將您的文章轉換為語音。</p>
            <p>請登入並前往「我的文章」頁面開始使用。</p>
        </div>

        <div class="speed-control-container auth-required">
            <h3>語音速度設定</h3>
            <div class="speed-options">
                <label class="speed-option">
                    <input type="radio" name="speed" value="0.7" id="speed-slow">
                    <span>慢</span>
                </label>
                <label class="speed-option">
                    <input type="radio" name="speed" value="0.8" id="speed-medium">
                    <span>稍慢</span>
                </label>
                <label class="speed-option">
                    <input type="radio" name="speed" value="1.0" id="speed-normal" checked>
                    <span>正常</span>
                </label>
            </div>
        </div>

        <div id="status-message"></div>

        <div id="text-display"></div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
