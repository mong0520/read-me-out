<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Read Me Out - Text to Speech</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script>
        // 定義全局變數
        window.BASE_PATH = "{{ prefix }}";
    </script>
</head>
<body data-prefix="{{ prefix }}">
    <div class="overlay"></div>

    <!-- Hamburger Menu Button -->
    <div class="hamburger-menu">
        <div class="hamburger-icon">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h3>Read Me Out</h3>
            <div class="close-sidebar">
                <i class="fas fa-times"></i>
            </div>
        </div>
        <div class="sidebar-content">
            <ul class="sidebar-menu">
                <li><a href="{{ url_for('index') }}"><i class="fas fa-home"></i> Home</a></li>
                <li class="auth-required"><a href="{{ url_for('dashboard') }}"><i class="fas fa-book"></i> My Articles</a></li>
            </ul>
        </div>
    </div>

    <div class="container">
        <div class="header-container">
            <h1>Read Me Out</h1>
            <div class="user-container">
                <div class="user-info">
                    <div class="user-pic"></div>
                    <div class="user-info-text">
                        <div class="user-name"></div>
                        <span class="user-plan-label"></span>
                    </div>
                    <a href="#" id="logout-link" class="logout-btn">Logout</a>
                </div>
                <div class="login-container">
                    <a href="{{ url_for('login') }}" class="login-btn">
                        <i class="fab fa-google"></i> Sign in with Google
                    </a>
                </div>
            </div>
        </div>

        <div class="speed-control-container auth-required">
            <h3>語音速度設定</h3>
            <div class="speed-options">
                <label class="speed-option">
                    <input type="radio" name="speed" value="0.7" id="speed-slow">
                    <span>慢</span>
                </label>
                <label class="speed-option">
                    <input type="radio" name="speed" value="0.8" id="speed-medium" checked>
                    <span>稍慢</span>
                </label>
                <label class="speed-option">
                    <input type="radio" name="speed" value="1.0" id="speed-normal">
                    <span>正常</span>
                </label>
            </div>

            <!-- 添加翻譯控制 -->
            <div class="translation-control">
                <h3>翻譯設定</h3>
                <label class="translation-toggle">
                    <input type="checkbox" id="show-translation" checked>
                    <span>顯示單字翻譯</span>
                </label>
            </div>
        </div>

        <!-- 文章列表區塊 - 只有登入用戶才能看到 -->
        {% if not article_id %}
        <div id="index-articles-section" class="index-articles-section auth-required">
            <h3>我的文章</h3>
            <div id="index-articles-list" class="index-articles-list"></div>
        </div>
        {% endif %}

        <div id="text-display"></div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
