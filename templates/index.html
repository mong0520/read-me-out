<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text-to-Speech with AWS Polly</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="header-container">
            <h1>Text-to-Speech with AWS Polly</h1>
            <div id="user-container" class="user-container">
                <div id="user-info" class="user-info" style="display: none;">
                    <img id="user-pic" class="user-pic" src="" alt="Profile picture">
                    <span id="user-name"></span>
                    <a href="/logout" class="logout-btn">Logout</a>
                </div>
                <div id="login-container" class="login-container">
                    <a href="/login" class="login-btn">
                        <i class="fab fa-google"></i> Sign in with Google
                    </a>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="text-input">Enter your text:</label>
            <textarea id="text-input" placeholder="Type or paste your text here..."></textarea>
        </div>

        <div class="form-group">
            <label for="speed-control">Speech Speed: <span id="speed-value">80%</span></label>
            <div class="speed-control-container">
                <span class="speed-label">Slower</span>
                <input type="range" id="speed-control" min="0.5" max="1.0" step="0.1" value="0.8">
                <span class="speed-label">Normal</span>
            </div>
        </div>

        <div class="controls">
            <button id="submit-button">Convert to Speech</button>
            <div class="cache-info">
                <span class="cache-icon" title="Caching enabled">💾</span>
                <span class="cache-text">Caching enabled</span>
            </div>
        </div>

        <div id="loading" class="loading">
            <div class="loading-spinner"></div>
            <p>Processing your text...</p>
        </div>

        <div id="status" class="status"></div>

        <div id="text-display" class="text-display">
            <!-- Processed text will appear here -->
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
